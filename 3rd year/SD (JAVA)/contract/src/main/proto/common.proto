syntax = "proto3";

package pt.tecnico.blockchainist.contract;

// The following option causes top-level messages, enums, and services to be
// defined at the package level, rather than inside an outer class named after
// the .proto file.
option java_multiple_files = true;

message CreateWalletRequest {
  string userId = 1;
  string walletId = 2;
  string client_tx_id = 3;
}

message SignedCreateWalletRequest {
  CreateWalletRequest createWalletRequest = 1;
  Signature signature = 2;
}

message DeleteWalletRequest {
  string userId = 1;
  string walletId = 2;
  string client_tx_id = 3;
}

message SignedDeleteWalletRequest {
  DeleteWalletRequest deleteWalletRequest = 1;
  Signature signature = 2;
}

message TransferRequest {
  string src_userId = 1;
  string src_walletId = 2;
  string dst_walletId = 3;
  uint64 value = 4;
  string client_tx_id = 5;
}

message SignedTransferRequest {
  TransferRequest transferRequest = 1;
  Signature signature = 2;
}

message Signature {
     // string signerIdentifier = 1;
    bytes signatureValue = 1;
}

message Transaction {
  oneof operation {
    SignedCreateWalletRequest create_wallet = 1;
    SignedDeleteWalletRequest delete_wallet = 2;
    SignedTransferRequest transfer = 3;
  }
}
